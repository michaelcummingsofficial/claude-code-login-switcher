# One-time helper for wiring the Marketplace publisher to an Entra ID identity.
#
# The Marketplace member picker only accepts an identity's Azure DevOps profile id, which appears
# nowhere in the Entra portal and can only be read from a token minted as the identity itself.
# Run this workflow to print it, add it as a publisher member, then run it again to verify.
# Delete this file once the first release has published.
name: Marketplace identity

on:
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: production # Must match the federated credential's subject
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print the Azure DevOps profile id
        run: |
          # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource id.
          PROFILE_ID=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)

          echo "### Azure DevOps profile id" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$PROFILE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Add this as a member of the michaelcummingsofficial publisher, with the Contributor role." >> "$GITHUB_STEP_SUMMARY"

      - name: Check publish rights
        run: |
          # Expected to fail until the profile id above is a publisher member.
          if pnpm dlx @vscode/vsce@4 verify-pat michaelcummingsofficial --azure-credential; then
            echo "The identity can publish. Delete this workflow and release normally." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not a publisher member yet. Add the profile id above, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
